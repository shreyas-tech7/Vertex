name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, unit tests, build, forbidden-content scan
        run: npm run check
      - name: Generated pages are committed
        run: git diff --exit-code
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (Chromium, Firefox, WebKit, phone viewport)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
